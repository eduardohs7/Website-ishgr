<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAGS 14 | Login do Participante</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css?v=9"> <!-- Puxando o CSS da pasta principal -->
</head>
<body>
    <!-- Navbar Simplificada -->
    <nav class="navbar auth-navbar">
        <a href="index.html">
            <h2 class="auth-brand-title">CHAGS 14</h2>
        </a>
                <!-- Novo Dropdown de Idiomas à direita -->
                <div class="lang-dropdown">
                    <button class="lang-btn">PT-BR <span>▼</span></button>
                    <div class="lang-content">
                        <a href="../index.html">EN</a>
                        <a href="../pt-br/index.html">PT-BR</a>
                        <a href="../fr/index.html">FR</a>
                    </div>
                </div>
            </div>
    </nav>

    <!-- Área de Login -->
    <div class="auth-wrapper">
        <div class="auth-panel">
            <span class="badge-text">Portal do Congressista</span>
            <h2 class="auth-title">Entrar na Área</h2>
            <p class="auth-desc">Faça login para acessar a Área do Participante e gerenciar seus trabalhos.</p>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="email">Endereço de E-mail</label>
                    <input type="email" id="email" class="form-control" placeholder="Digite seu e-mail" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" class="form-control" placeholder="Digite sua senha" required>
                </div>
                
                <div class="auth-remember-row">
                    <label class="auth-checkbox-label">
                        <input type="checkbox"> Lembrar-me
                    </label>
                    <a href="#" class="auth-link-accent">Esqueceu a senha?</a>
                </div>
                
                <button type="submit" class="btn-submit-full">Entrar</button>
            </form>
            
            <div class="auth-footer-note">
                Ainda não tem uma conta? <a href="/conta/cadastro/" class="auth-link-strong">Cadastre-se aqui</a>
            </div>
        </div>
    </div>
</body>
</html>
