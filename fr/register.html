<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAGS 14 | Créer un compte</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css?v=15"> 
</head>
<body>
    <!-- Navbar Simplificada -->
    <nav class="navbar auth-navbar">
        <a href="index.html">
            <h2 class="auth-brand-title">CHAGS 14</h2>
        </a>
        <!-- Novo Dropdown de Idiomas à direita -->
        <div class="nav-actions">
            <div class="lang-dropdown">
                <button class="lang-btn">FR <span>▼</span></button>
                <div class="lang-content">
                    <a href="../index.html">EN</a>
                    <a href="../pt-br/index.html">PT-BR</a>
                    <a href="../es/index.html">ES</a>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Área de Registro -->
    <div class="auth-wrapper"> 
        <div class="auth-panel auth-panel-wide"> 
            <h2 class="auth-title">Créer un compte</h2>
            <p class="auth-desc">Rejoignez la plateforme de CHAGS 14 pour soumettre et suivre vos travaux.</p>
            
            <form action="#" method="POST">
                <!-- Organização em duas colunas para telas maiores -->
                <div class="form-grid-asymmetric">
                    <div class="form-group">
                        <label for="firstname">Prénom</label>
                        <input type="text" id="firstname" class="form-control" placeholder="Ex : Jean" required>
                    </div>
                    <div class="form-group">
                        <label for="lastname">Nom de famille</label>
                        <input type="text" id="lastname" class="form-control" placeholder="Ex : Dupont" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="institution">Institution / Affiliation</label>
                    <input type="text" id="institution" class="form-control" placeholder="Ex : UFPA" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" class="form-control" placeholder="nom@exemple.com" required>
                </div>
                
                <div class="form-grid-asymmetric">
                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" class="form-control" placeholder="Créez un mot de passe" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirmer le mot de passe</label>
                        <input type="password" id="confirm-password" class="form-control" placeholder="Répétez le mot de passe" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit-full mt-20">S'inscrire</button>
            </form>
            
            <div class="auth-footer-note">
                Vous avez déjà un compte ? <a href="login.html" class="auth-link-strong">Se connecter</a>
            </div>
        </div>
    </div>
</body>
</html>
