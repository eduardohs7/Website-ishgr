<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAGS 14 | Connexion du Participant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css?v=9"> <!-- Puxando o CSS da pasta principal -->
</head>
<body>
    <!-- Navbar Simplificada -->
    <nav class="navbar auth-navbar">
        <a href="index.html">
            <h2 class="auth-brand-title">CHAGS 14</h2>
        </a>
        <!-- Novo Dropdown de Idiomas à direita -->
        <div class="nav-actions">
            <div class="lang-dropdown">
                <button class="lang-btn">FR <span>▼</span></button>
                <div class="lang-content">
                    <a href="../index.html">EN</a>
                    <a href="../pt-br/index.html">PT-BR</a>
                    <a href="../es/index.html">ES</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Área de Login -->
    <div class="auth-wrapper">
        <div class="auth-panel">
            <span class="badge-text">Portail du Congressiste</span>
            <h2 class="auth-title">Se connecter à l'Espace</h2>
            <p class="auth-desc">Connectez-vous pour accéder à l'Espace Participant et gérer vos travaux.</p>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" class="form-control" placeholder="Saisissez votre e-mail" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" class="form-control" placeholder="Saisissez votre mot de passe" required>
                </div>
                
                <div class="auth-remember-row">
                    <label class="auth-checkbox-label">
                        <input type="checkbox"> Se souvenir de moi
                    </label>
                    <a href="#" class="auth-link-accent">Mot de passe oublié ?</a>
                </div>
                
                <button type="submit" class="btn-submit-full">Se connecter</button>
            </form>
            
            <div class="auth-footer-note">
                Vous n'avez pas encore de compte ? <a href="cadastro.html" class="auth-link-strong">Inscrivez-vous ici</a>
            </div>
        </div>
    </div>
</body>
</html>
