<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAGS 14 | Participant Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <!-- Certifique-se de que o nome do seu CSS é este -->
</head>
<body>
    <!-- Navbar Simplificada -->
    <nav class="navbar" style="justify-content: center; padding: 20px 5%;">
        <a href="index.html">
            <h2 style="color: var(--text-dark); letter-spacing: -1px; font-size: 2rem;">CHAGS 14</h2>
        </a>
                <!-- Novo Dropdown de Idiomas à direita -->
                <div class="lang-dropdown" style="margin-left: auto;">
                    <button class="lang-btn">EN <span>▼</span></button>
                    <div class="lang-content">
                        <a href="pt-br/login.html">PT-BR</a>
                        <a href="es/index.html">ES</a>
                        <a href="fr/index.html">FR</a>
                    </div>
                </div>
            </div>
    </nav>

    <main class="auth-wrapper">
            <div class="auth-card">
                <span class="badge-text">CONGRESSMAN'S PORTAL</span>
                <h1 class="auth-title">Enter the area</h1>
                <p class="auth-desc">Enter your credentials to manage your subscriptions and registration details for CHAGS 14.</p>
                
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                    </div>
                    
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; font-size: 0.85rem;">
                        <label style="display: flex; align-items: center; gap: 5px; font-weight: 500; cursor: pointer;">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" style="color: var(--accent); font-weight: 600;">Forgot password?</a>
                    </div>
                    
                    <button type="submit" class="btn-submit-full">Log In</button>
                </form>
                
                <div style="text-align: center; margin-top: 30px; font-size: 0.9rem; color: var(--text-body);">
                    Don't have an account yet? <a href="register.html" style="color: var(--text-dark); font-weight: 700;">Register here</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
