name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# Push and PR events for the same source branch share one active execution.
concurrency:
  group: backend-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django e PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter o código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Preparar Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências com hashes
        run: python -m pip install --require-hashes -r backend/requirements.txt

      - name: Preparar clientes PostgreSQL para os testes de backup
        run: |
          if [ ! -x /usr/lib/postgresql/17/bin/pg_dump ] || [ ! -x /usr/lib/postgresql/17/bin/pg_restore ]; then
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/chags-pgdg.asc"
            fingerprint=$(gpg --batch --show-keys --with-colons "$RUNNER_TEMP/chags-pgdg.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
            test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
            sudo install -m 0644 "$RUNNER_TEMP/chags-pgdg.asc" /usr/share/keyrings/chags-pgdg.asc
            echo 'deb [signed-by=/usr/share/keyrings/chags-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' \
              | sudo tee /etc/apt/sources.list.d/chags-pgdg.list
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes postgresql-client-17
          fi
          echo "CHAGS_PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"

      - name: Iniciar PostgreSQL de testes
        run: python backend/scripts/ci-postgres.py start

      - name: Verificar configuração e migrações
        run: |
          python backend/manage.py check --database default
          python backend/manage.py makemigrations --check --dry-run
          python backend/manage.py migrate --noinput
          python backend/manage.py migrate --check

      - name: Executar testes do backend
        run: python backend/manage.py test accounts registrations operations certificates config.tests --noinput

      - name: Verificar coleta dos arquivos estáticos
        run: python backend/manage.py collectstatic --noinput

      - name: Remover o banco temporário
        if: always()
        run: |
          if [ -f backend/scripts/ci-postgres.py ]; then
            python backend/scripts/ci-postgres.py stop
          fi
