<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAGS 14 | Crear Cuenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css?v=9"> 
</head>
<body>
    <!-- Navbar Simplificada -->
    <nav class="navbar auth-navbar">
        <a href="index.html">
            <h2 class="auth-brand-title">CHAGS 14</h2>
        </a>
        <!-- Novo Dropdown de Idiomas à direita -->
        <div class="nav-actions">
            <div class="lang-dropdown">
                <button class="lang-btn">ES <span>▼</span></button>
                <div class="lang-content">
                    <a href="../index.html">EN</a>
                    <a href="../pt-br/index.html">PT-BR</a>
                    <a href="../fr/index.html">FR</a>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Área de Registro -->
    <div class="auth-wrapper"> 
        <div class="auth-panel auth-panel-wide"> 
            <h2 class="auth-title">Crear una Cuenta</h2>
            <p class="auth-desc">Únase a la plataforma de CHAGS 14 para enviar y hacer seguimiento de sus trabajos.</p>
            
            <form action="#" method="POST">
                <!-- Organização em duas colunas para telas maiores -->
                <div class="form-grid-asymmetric">
                    <div class="form-group">
                        <label for="firstname">Nombre</label>
                        <input type="text" id="firstname" class="form-control" placeholder="Ej: Juan" required>
                    </div>
                    <div class="form-group">
                        <label for="lastname">Apellido</label>
                        <input type="text" id="lastname" class="form-control" placeholder="Ej: Pérez" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="institution">Institución / Afiliación</label>
                    <input type="text" id="institution" class="form-control" placeholder="Ej: UFPA" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="nombre@ejemplo.com" required>
                </div>
                
                <div class="form-grid-asymmetric">
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" class="form-control" placeholder="Cree una contraseña" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirmar Contraseña</label>
                        <input type="password" id="confirm-password" class="form-control" placeholder="Repita la contraseña" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit-full mt-20">Registrarse</button>
            </form>
            
            <div class="auth-footer-note">
                ¿Ya tiene una cuenta? <a href="login.html" class="auth-link-strong">Iniciar sesión</a>
            </div>
        </div>
    </div>
</body>
</html>
