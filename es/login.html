<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAGS 14 | Login del Participante</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css?v=8"> <!-- Puxando o CSS da pasta principal -->
</head>
<body>
    <!-- Navbar Simplificada -->
    <nav class="navbar auth-navbar">
        <a href="index.html">
            <h2 class="auth-brand-title">CHAGS 14</h2>
        </a>
        <!-- Novo Dropdown de Idiomas à direita -->
        <div class="nav-actions">
            <div class="lang-dropdown">
                <button class="lang-btn">ES <span>▼</span></button>
                <div class="lang-content">
                    <a href="../index.html">EN</a>
                    <a href="../pt-br/index.html">PT-BR</a>
                    <a href="../fr/index.html">FR</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Área de Login -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <span class="badge-text">Portal del Congresista</span>
            <h2 class="auth-title">Entrar al Área</h2>
            <p class="auth-desc">Inicie sesión para acceder al Área del Participante y gestionar sus trabajos.</p>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="Ingrese su correo electrónico" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="Ingrese su contraseña" required>
                </div>
                
                <div class="auth-remember-row">
                    <label class="auth-checkbox-label">
                        <input type="checkbox"> Recordarme
                    </label>
                    <a href="#" class="auth-link-accent">¿Olvidó su contraseña?</a>
                </div>
                
                <button type="submit" class="btn-submit-full">Iniciar sesión</button>
            </form>
            
            <div class="auth-footer-note">
                ¿Aún no tiene una cuenta? <a href="cadastro.html" class="auth-link-strong">Regístrese aquí</a>
            </div>
        </div>
    </div>
</body>
</html>
