{% if form.non_field_errors %}<div class="account-errors" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  <div class="form-group">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p class="account-help">{{ field.help_text }}</p>{% endif %}
    {% if field.errors %}<div class="account-errors" role="alert">{{ field.errors }}</div>{% endif %}
  </div>
{% endfor %}
